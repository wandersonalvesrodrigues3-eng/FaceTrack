<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FaceTrack V3 - Idade e Gênero</title>
<meta name="theme-color" content="#00f5ff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "human": "https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.4/dist/human.esm.js"
  }
}
</script>
<style>
 body{background:#0a0a0f; color:white; font-family:system-ui}
 .glass{background:rgba(20,20,30,0.85); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.12)}
</style>
</head>
<body class="min-h-screen flex flex-col max-w-[480px] mx-auto">
<header class="p-4 flex justify-between">
 <h1 class="font-black">FACE<span class="text-cyan-400">TRACK</span> V3</h1>
 <span id="badge" class="text-[10px] bg-white/10 px-2 py-1 rounded-full">Carregando IA...</span>
</header>
<main class="px-4 pb-6 flex flex-col gap-3">
 <div class="glass rounded-2xl p-3 text-sm">
   <div id="status">Inicializando Human AI (nova engine)...</div>
   <div id="log" class="text-[10px] opacity-60 mt-1"></div>
 </div>
 <div class="relative rounded-[28px] overflow-hidden bg-black aspect-[3/4]">
   <video id="video" autoplay playsinline muted class="w-full h-full object-cover scale-x-[-1]"></video>
   <canvas id="canvas" class="absolute inset-0 w-full h-full"></canvas>
   <div id="cards" class="absolute inset-0 pointer-events-none"></div>
   <div id="idle" class="absolute inset-0 bg-[#0a0a0f] flex flex-col items-center justify-center p-6 text-center">
     <div class="text-4xl mb-3">🧠</div>
     <p class="font-bold">IA V3 carregando...</p>
     <p class="text-xs opacity-60 mt-2">Primeira vez baixa ~12MB, depois fica offline</p>
   </div>
 </div>
 <div class="grid grid-cols-2 gap-3">
   <button id="startBtn" class="bg-cyan-400 text-black font-black py-4 rounded-2xl">▶ INICIAR</button>
   <button id="switchBtn" class="glass py-4 rounded-2xl font-bold">🔄 Virar</button>
 </div>
 <button id="photoBtn" class="glass py-3 rounded-2xl text-sm">🖼️ Analisar foto da galeria (privado)</button>
 <input id="fileInput" type="file" accept="image/*" class="hidden">
 <p id="hint" class="text-[11px] opacity-50 text-center">Dica: luz na frente, rosto de frente, tire óculos escuros</p>
</main>

<script type="module">
import Human from 'human';

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const logEl=document.getElementById('log');
const badge=document.getElementById('badge');
const cards=document.getElementById('cards');
const idle=document.getElementById('idle');
const startBtn=document.getElementById('startBtn');

let stream=null, facing='user', human=null, running=false, deferredPrompt=null;

function log(m){ logEl.textContent=m; console.log(m); }
function setStatus(m){ statusEl.textContent=m; }

const humanConfig={
  backend:'webgl',
  modelBasePath:'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.4/models',
  filter:{enabled:true, equalization:true},
  face:{
    enabled:true,
    detector:{rotation:true, maxDetected:5, minConfidence:0.3},
    mesh:{enabled:true},
    iris:{enabled:false},
    description:{enabled:false},
    emotion:{enabled:false},
    age:{enabled:true},
    gender:{enabled:true},
  },
  body:{enabled:false},
  hand:{enabled:false},
  object:{enabled:false},
  gesture:{enabled:false},
};

async function initHuman(){
  try{
    setStatus('Baixando Human AI...');
    human=new Human.Human(humanConfig);
    await human.load();
    await human.warmup();
    setStatus('✅ IA V3 pronta! Clique em INICIAR e aponte pro rosto.');
    badge.textContent='✅ V3 Pronto';
    idle.innerHTML='<div class="text-5xl mb-3">📷</div><p class="font-bold">Pronto!</p><p class="text-xs opacity-60 mt-2">Toque em INICIAR</p>';
    log('Human loaded: '+human.version);
  }catch(e){
    setStatus('❌ Falha Human: '+e.message);
    log(e.stack);
    badge.textContent='❌ Erro IA';
  }
}
initHuman();

async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    const c={video:{facingMode:facing, width:{ideal:720}, height:{ideal:960}}, audio:false};
    stream=await navigator.mediaDevices.getUserMedia(c);
    video.srcObject=stream;
    await video.play();
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    idle.classList.add('hidden');
    startBtn.textContent='⏸ PAUSAR';
    badge.textContent='● Ao vivo V3';
    running=true;
    loop();
  }catch(e){
    setStatus('🔒 '+e.name+': libere a câmera no cadeado');
  }
}
function stopCam(){
  running=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  video.srcObject=null;
  idle.classList.remove('hidden');
  idle.innerHTML='<div class="text-4xl">⏸️</div><p>Pausado</p>';
  startBtn.textContent='▶ INICIAR';
  ctx.clearRect(0,0,canvas.width,canvas.height);
  cards.innerHTML='';
}

async function loop(){
  if(!running) return;
  if(!human) { requestAnimationFrame(loop); return; }
  const result=await human.detect(video);
  draw(result);
  setTimeout(()=>requestAnimationFrame(loop), 120);
}

function draw(result){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  cards.innerHTML='';
  if(!result.face || result.face.length===0){
    if(Date.now()%2000<100) setStatus('Procurando rosto... chegue mais perto, luz na frente');
    return;
  }
  result.face.forEach(f=>{
    const [x,y]=f.box;
    const w=f.box[2], h=f.box[3];
    const isMale=(f.gender||'')==='male' || (f.genderScore||0) <0.5 && f.gender==='female' ? false : f.gender==='male';
    // Human gender gives string + score
    const genderLabel=f.gender||'';
    const genderScore=Math.round((f.genderScore||0)*100);
    const age=Math.round(f.age||0);
    const color=genderLabel==='male'?'#00f5ff':'#ff5af7';
    
    ctx.strokeStyle=color; ctx.lineWidth=3; ctx.shadowColor=color; ctx.shadowBlur=10;
    ctx.strokeRect(x,y,w,h); ctx.shadowBlur=0;
    
    // draw landmarks tiny
    if(f.mesh){
      ctx.fillStyle=color;
      f.mesh.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt[0],pt[1],1,0,Math.PI*2); ctx.fill(); });
    }

    const card=document.createElement('div');
    card.className='absolute glass rounded-xl px-3 py-2 text-[13px]';
    card.style.left=(x/canvas.width*100)+'%';
    card.style.top=Math.min(92,(y+h)/canvas.height*100+1)+'%';
    card.style.borderLeft='4px solid '+color;
    card.innerHTML=`<b>${genderLabel==='male'?'👨 Homem':'👩 Mulher'} ${genderScore?genderScore+'%':''}</b><br>Idade ~<b>${age||'?'}</b> anos`;
    cards.appendChild(card);
  });
  setStatus(`✅ ${result.face.length} rosto(s) | ${result.face.map(f=>Math.round(f.age||0)+'a '+f.gender).join(', ')} | ${Math.round(1000/result.performance.total)}ms`);
}

// events
startBtn.onclick=()=>{ if(running) stopCam(); else startCam(); };
document.getElementById('switchBtn').onclick=()=>{
  facing=facing==='user'?'environment':'user';
  video.classList.toggle('scale-x-[-1]', facing==='user');
  if(running) startCam();
};
document.getElementById('photoBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async(e=>{
  const file=e.target.files[0]; if(!file) return;
  const img=new Image(); img.src=URL.createObjectURL(file);
  await img.decode();
  canvas.width=img.width; canvas.height=img.height;
  ctx.drawImage(img,0,0);
  const res=await human.detect(img);
  draw(res);
  idle.classList.add('hidden');
  video.style.display='none';
  running=false;
  setStatus('Foto analisada: '+res.face.length+' rosto(s)');
};

// PWA SW
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').then(()=>badge.textContent+=' PWA'); }
</script>
</body>
</html>
